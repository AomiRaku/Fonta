[package]
name = "fontfox"
version = "1000.1.0"
description = "FontFox — 快速流畅且易用的本地字体管理器"
authors = ["羽梦千景 Raku Inkyetta"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fontfox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
ab_glyph = "0.2"
memmap2 = "0.9"
png = "0.17"
base64 = "0.22"
rayon = "1"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Threading",

  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Dwm",
] }
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
